<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1424"/><stop offset="1" stop-color="#142640"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#5B6CFA"/><stop offset="1" stop-color="#1EC8B5"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020713" flood-opacity=".32"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#89A5C5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>.title{font:700 43px 'Segoe UI',Arial,sans-serif;fill:#F5F8FF}.sub{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#9FB2CC}.eyebrow{font:700 14px 'Segoe UI',Arial,sans-serif;letter-spacing:2.4px;fill:#66DBC9}.card{fill:#182A43;stroke:#304761;stroke-width:1.5}.label{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#F4F7FC}.small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#A8B9CE}.tag{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.3px;fill:#A8BDD7}.arrow{fill:none;stroke:#89A5C5;stroke-width:2.5;marker-end:url(#arrow)}.num{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#EAF0FC}</style></defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><circle cx="1500" cy="30" r="250" fill="#3A56A8" opacity=".11"/><circle cx="80" cy="860" r="200" fill="#19B9A9" opacity=".07"/>
<text x="86" y="76" class="eyebrow">AI CODE REVIEWER  /  QUICK CHECK</text><text x="86" y="134" class="title">Review code before it becomes a PR</text><text x="86" y="169" class="sub">A user can submit pasted code or files and inspect a saved review in the dashboard.</text>
<!-- inputs -->
<g filter="url(#shadow)"><rect x="82" y="264" width="320" height="170" rx="22" class="card"/></g><circle cx="124" cy="308" r="22" fill="#273B66"/><path d="M115 298h18v21h-18zM119 303h10m-10 5h10m-10 5h7" fill="none" stroke="#BEC9FF" stroke-width="1.8"/><text x="164" y="305" class="label">Provide code</text><text x="109" y="356" class="small">Paste source code or upload</text><text x="109" y="379" class="small">one or more supported files.</text><rect x="109" y="398" width="114" height="22" rx="11" fill="#263C58"/><text x="124" y="413" class="tag">USER ACTION</text>
<path d="M402 349h57" class="arrow"/>
<g filter="url(#shadow)"><rect x="465" y="264" width="320" height="170" rx="22" class="card"/></g><circle cx="507" cy="308" r="22" fill="#214F59"/><path d="M498 302h18v13h-18zM502 298v8m10-8v8" fill="none" stroke="#8DE5D8" stroke-width="1.8"/><text x="547" y="305" class="label">Validate and group</text><text x="492" y="356" class="small">Check the request and organize</text><text x="492" y="379" class="small">the submitted code for analysis.</text><rect x="492" y="398" width="135" height="22" rx="11" fill="#173D49"/><text x="507" y="413" class="tag">EXPRESS API</text>
<path d="M785 349h57" class="arrow"/>
<g filter="url(#shadow)"><rect x="848" y="264" width="320" height="170" rx="22" class="card"/></g><circle cx="890" cy="308" r="22" fill="#2B3F67"/><path d="M880 308h20m-10-10v20m-8-17 16 14m0-14-16 14" stroke="#BEC9FF" stroke-width="1.6" fill="none"/><text x="930" y="305" class="label">Analyze code</text><text x="875" y="356" class="small">Run Semgrep and Gemini on</text><text x="875" y="379" class="small">the submitted code.</text><rect x="875" y="398" width="153" height="22" rx="11" fill="#222F55"/><text x="890" y="413" class="tag">REVIEW ENGINE</text>
<path d="M1008 434v72h-285v43" class="arrow"/>
<!-- branch -->
<g filter="url(#shadow)"><rect x="572" y="560" width="302" height="170" rx="22" class="card"/></g><circle cx="614" cy="604" r="22" fill="#214F59"/><path d="m605 605 7 7 13-15" stroke="#9AECDD" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="601" class="label">Save the review</text><text x="599" y="652" class="small">Store the results and make</text><text x="599" y="675" class="small">them available to the user.</text><rect x="599" y="694" width="169" height="22" rx="11" fill="#173D49"/><text x="614" y="709" class="tag">NEON POSTGRESQL</text>
<!-- optional branch -->
<path d="M1168 349h58v104h44" class="arrow"/><g filter="url(#shadow)"><rect x="1270" y="400" width="260" height="142" rx="21" class="card"/></g><circle cx="1310" cy="441" r="20" fill="#234456"/><path d="M1303 432v18m0-12h14m0 0-5-5m5 5-5 5" stroke="#91DCD5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1347" y="438" class="label">Optional next step</text><text x="1295" y="484" class="small">Create a branch and PR</text><text x="1295" y="506" class="small">from reviewed code.</text>
<!-- display -->
<path d="M874 645h82" class="arrow"/><g filter="url(#shadow)"><rect x="966" y="560" width="262" height="170" rx="22" class="card"/></g><circle cx="1008" cy="604" r="22" fill="#273B66"/><path d="M998 597h20v15h-20zM1002 593h12m-12 9h11" fill="none" stroke="#BEC9FF" stroke-width="1.8"/><text x="1048" y="601" class="label">Inspect results</text><text x="993" y="652" class="small">Review findings, severity</text><text x="993" y="675" class="small">and suggested explanations.</text><rect x="993" y="694" width="124" height="22" rx="11" fill="#263C58"/><text x="1008" y="709" class="tag">DASHBOARD</text>
<path d="M84 784h1432" stroke="#30445E" stroke-width="1"/><text x="86" y="820" class="small">When Gemini is unavailable, static findings may still be saved. An optional PR action depends on supported code and permissions.</text><text x="1515" y="820" text-anchor="end" class="tag">03 / QUICK CHECK</text>
</svg>
