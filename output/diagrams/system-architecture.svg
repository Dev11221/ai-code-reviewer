<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1424"/><stop offset="1" stop-color="#142640"/></linearGradient>
  <linearGradient id="accent" x2="1"><stop stop-color="#5B6CFA"/><stop offset="1" stop-color="#1EC8B5"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020713" flood-opacity=".34"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#89A5C5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .title{font:700 43px 'Segoe UI',Arial,sans-serif;fill:#F5F8FF}.sub{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#9FB2CC}.eyebrow{font:700 14px 'Segoe UI',Arial,sans-serif;letter-spacing:2.4px;fill:#66DBC9}.card{fill:#182A43;stroke:#304761;stroke-width:1.5}.card2{fill:#15273E;stroke:#304761;stroke-width:1.5}.label{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#F4F7FC}.small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#A8B9CE}.tag{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.3px;fill:#A8BDD7}.num{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#E9F0FA}.arrow{fill:none;stroke:#89A5C5;stroke-width:2.5;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 8}
  </style>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><circle cx="1460" cy="60" r="270" fill="#3A56A8" opacity=".12"/><circle cx="95" cy="830" r="220" fill="#19B9A9" opacity=".07"/>
<text x="86" y="76" class="eyebrow">AI CODE REVIEWER  /  SYSTEM DESIGN</text><text x="86" y="134" class="title">One review engine, two ways to start</text><text x="86" y="169" class="sub">A shared analysis pipeline turns code changes into actionable findings.</text>
<!-- triggers -->
<g filter="url(#shadow)"><rect x="72" y="237" width="248" height="116" rx="20" class="card"/><rect x="72" y="388" width="248" height="116" rx="20" class="card"/></g>
<circle cx="116" cy="282" r="21" fill="#293A67"/><path d="M106 282h20m-8-8 8 8-8 8" stroke="#AAB9FF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="151" y="278" class="label">GitHub PR</text><text x="151" y="304" class="small">Opened or updated</text><text x="96" y="334" class="tag">AUTOMATIC REVIEW</text>
<circle cx="116" cy="433" r="21" fill="#154F59"/><path d="M108 426h16v14h-16zM111 422v8m10-8v8" stroke="#8DE5D8" stroke-width="2" fill="none" stroke-linecap="round"/><text x="151" y="429" class="label">Quick Check</text><text x="151" y="455" class="small">Paste code or upload files</text><text x="96" y="485" class="tag">ON-DEMAND REVIEW</text>
<path d="M320 295h45v151h-45" class="arrow"/><path d="M365 370h36" class="arrow"/>
<!-- API -->
<g filter="url(#shadow)"><rect x="404" y="297" width="250" height="146" rx="22" class="card"/></g><rect x="404" y="297" width="6" height="146" rx="3" fill="url(#accent)"/><rect x="432" y="320" width="44" height="25" rx="12" fill="#263D59"/><text x="443" y="337" class="tag">API</text><text x="432" y="379" class="label">Node.js + Express</text><text x="432" y="405" class="small">Validate · authorize · queue</text><text x="432" y="427" class="small">and coordinate the review</text>
<path d="M654 370h48" class="arrow"/>
<!-- review engine -->
<g filter="url(#shadow)"><rect x="705" y="240" width="395" height="385" rx="26" class="card2"/></g><text x="738" y="282" class="tag">SHARED REVIEW PIPELINE</text>
<rect x="737" y="307" width="331" height="82" rx="17" fill="#202F58" stroke="#4D5F94"/><circle cx="771" cy="348" r="18" fill="#5B67CF"/><path d="m762 348 6 6 12-13" stroke="white" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="802" y="344" class="label">Semgrep</text><text x="802" y="368" class="small">Rule-based static findings</text>
<rect x="737" y="408" width="331" height="82" rx="17" fill="#143C48" stroke="#2E7B7D"/><circle cx="771" cy="449" r="18" fill="#168E89"/><path d="M763 450h16m-8-8v16" stroke="white" stroke-width="2.1" stroke-linecap="round"/><text x="802" y="445" class="label">Google Gemini</text><text x="802" y="469" class="small">AI review for logic and edge cases</text>
<path d="M902 389v16" class="arrow"/><rect x="737" y="510" width="331" height="82" rx="17" fill="#172F42" stroke="#345F70"/><circle cx="771" cy="551" r="18" fill="#227184"/><path d="m761 551 7 7 13-15" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="802" y="547" class="label">Validate and combine</text><text x="802" y="571" class="small">Normalize findings · assign severity</text>
<!-- outputs -->
<path d="M1100 370h45v-100h30" class="arrow"/><path d="M1145 370v105h30" class="arrow"/>
<g filter="url(#shadow)"><rect x="1180" y="216" width="342" height="110" rx="20" class="card"/><rect x="1180" y="420" width="342" height="110" rx="20" class="card"/><rect x="1180" y="624" width="342" height="110" rx="20" class="card"/></g>
<circle cx="1223" cy="260" r="22" fill="#244B5A"/><path d="M1213 251h20v16h-20zM1218 256h10m-10 5h7" stroke="#84E1D2" stroke-width="1.8" fill="none"/><text x="1262" y="258" class="label">Neon PostgreSQL</text><text x="1262" y="284" class="small">Store reviews and findings</text>
<path d="M1351 326v72" class="arrow"/><g filter="url(#shadow)"></g>
<circle cx="1223" cy="464" r="22" fill="#253A65"/><path d="M1214 455h18v17h-18zM1218 451h10" stroke="#BDCAFF" stroke-width="1.8" fill="none"/><text x="1262" y="462" class="label">React dashboard</text><text x="1262" y="488" class="small">Browse, filter and inspect findings</text>
<path d="M1351 530v72" class="arrow"/>
<circle cx="1223" cy="668" r="22" fill="#263F67"/><path d="m1213 659 10-5 10 5v13l-10 5-10-5zM1213 659l10 5 10-5m-10 5v13" stroke="#AFC8EF" stroke-width="1.7" fill="none"/><text x="1262" y="666" class="label">GitHub PR comment</text><text x="1262" y="692" class="small">Post findings on automatic reviews</text>
<path d="M1100 552h42v171h38" class="arrow dashed"/><text x="1094" y="752" class="small">Automatic PR path</text>
<rect x="84" y="784" width="1432" height="1" fill="#30445E"/><text x="86" y="820" class="small">Human reviewers stay in control. AI and static checks provide suggestions; findings may be incomplete.</text><text x="1515" y="820" text-anchor="end" class="tag">01 / ARCHITECTURE</text>
</svg>
