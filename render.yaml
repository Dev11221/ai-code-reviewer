services:
  - type: web
    name: ai-code-reviewer
    runtime: node
    plan: free
    buildCommand: npm ci && npm ci --prefix dashboard/client && npm run build
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: verify
      - key: SESSION_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
